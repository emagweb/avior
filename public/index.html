<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF2790" />
    <meta
      name="description"

    />
    <meta name="application-name" content="Avior" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="Avior — React + Rsbuild starter" />
    <meta
      property="og:description"
      content="React, Rsbuild and Sass utilities named after the Emmet dictionary."
    />
    <meta property="og:site_name" content="Avior" />
    <meta property="og:image" content="/logo512.png" />
    <meta property="og:image:width" content="512" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Applies the saved theme before the first paint, so a dark reader never
      // gets a flash of the light one. The switch itself lives in Theme.jsx.
      (function () {
        try {
          var saved = localStorage.getItem('avior-theme');
          var dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
