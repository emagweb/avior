<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Avior — a design system for React</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0D14" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Avior is an open source design system for React and Rsbuild. Variables, helpers and components that build a different site every time, shaped by its content." />
    <meta name="application-name" content="Avior" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Avior — a design system for React" />
    <meta property="og:description" content="Avior is an open source design system for React and Rsbuild. Variables, helpers and components that build a different site every time, shaped by its content." />
    <meta property="og:site_name" content="Avior" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Avior: a design system for React that builds a different site every time." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('avior-mode');
          var dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.body.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
